- sample_id: fully-supported
  rubric_id: grounded_answer
  question: 为什么 AgentEvent 被称为事件信封，它服务哪些消费者？
  candidate: AgentEvent 用 type、元数据和不透明 payload 形成事件信封；trace、hook、流式输出与 eval replay 复用同一条事件流。
  reference: AgentEvent 是包含 type、元数据和不透明 payload 的事件信封。trace、hook、流式输出与 eval replay 复用同一条事件流。
  expected_scores:
    semantic_support: {min: 4, max: 4}
    question_coverage: {min: 3, max: 4}
    learning_usefulness: {min: 3, max: 4}

