- sample_id: unsupported-embellishment
  rubric_id: grounded_answer
  question: 事件信封是否保证运行时零故障并自动加密 payload？
  candidate: 事件信封保证运行时不会发生故障，而且会自动加密所有 payload。
  reference: AgentEvent 是包含 type、元数据和不透明 payload 的事件信封。错误本身也是一种 AgentEvent。
  expected_scores:
    semantic_support: {min: 1, max: 1}
    question_coverage: {min: 1, max: 2}
    learning_usefulness: {min: 1, max: 1}

