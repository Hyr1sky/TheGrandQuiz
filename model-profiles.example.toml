# Copy this file outside the repository, then set GRANDQUIZ_MODEL_CONFIG to its absolute path.
schema_version = "model-config.v1"
default_profile = "shared"

[connections.primary]
base_url = "https://api.deepseek.com/v1"
api_key_env = "LLM_API_KEY"
wire_api = "openai_chat_completions"

[profiles.shared]
connection = "primary"
model = "deepseek-chat"
timeout_seconds = 60
api_dialect = "deepseek"
thinking_mode = "disabled"
# Operator-declared conservative limits for eligibility checks. Verify these
# against the exact deployment before enabling fallback.
context_window_tokens = 32000
max_output_tokens = 4096

[profiles.shared.capabilities]
tools = "supported"
native_streaming = "supported"
structured_output = "unknown"
reasoning = "unsupported"

# Optional independent question-generation model. Uncomment this complete block,
# its purpose override, and the quality preset together.
#
# [connections.writer]
# base_url = "https://dashscope.aliyuncs.com/compatible-mode/v1"
# api_key_env = "DASHSCOPE_MODEL_KEY"
# wire_api = "openai_chat_completions"
#
# [profiles.writer]
# connection = "writer"
# model = "qwen-plus"
# timeout_seconds = 60
# api_dialect = "dashscope"
# thinking_mode = "disabled"
# context_window_tokens = 32000
# max_output_tokens = 4096
#
# [profiles.writer.capabilities]
# tools = "supported"
# native_streaming = "supported"
# structured_output = "unknown"
# reasoning = "unknown"

# Optional native Anthropic Messages profile. Uncomment the complete connection,
# profile, capabilities, and a purpose/preset reference together. max_output_tokens
# is required by Messages and is sent as the request's max_tokens.
#
# [connections.claude]
# base_url = "https://api.anthropic.com"
# api_key_env = "ANTHROPIC_API_KEY"
# wire_api = "anthropic_messages"
#
# [profiles.claude]
# connection = "claude"
# model = "your-claude-model"
# timeout_seconds = 60
# thinking_mode = "disabled"
# context_window_tokens = 32000
# max_output_tokens = 4096
#
# [profiles.claude.capabilities]
# tools = "supported"
# native_streaming = "supported"
# structured_output = "unknown"
# reasoning = "unsupported"

# [purpose_overrides]
# question_generation = "writer"

# Optional deterministic aliases for an explicit Chat/CLI choice. These labels
# do not benchmark or automatically route a model.
[presets]
fast = "shared"
# quality = "writer"

# Optional application-owned transport retry policy. max_attempts includes the
# initial request. The OpenAI SDK's hidden retry loop remains disabled.
[retry]
enabled = true
max_attempts = 3
deadline_seconds = 90.0
base_delay_seconds = 0.5
max_delay_seconds = 8.0
max_total_wait_seconds = 30.0
jitter_ratio = 0.2

# Optional serial availability fallback. It is disabled unless both the policy
# and an ordered, purpose-specific candidate list are explicitly configured.
# The listed profiles are also the data-transfer allowlist; configured keys are
# never discovered as fallback candidates automatically.
#
# [fallback]
# enabled = true
# max_attempts_per_candidate = 1
#
# [fallback_candidates]
# chat = ["writer"]
