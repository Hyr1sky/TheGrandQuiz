name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --dev

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install Web dependencies
        working-directory: web
        run: npm ci

      - name: Lint
        run: uv run ruff check .

      - name: Format check
        run: uv run ruff format --check .

      - name: Type check
        run: uv run pyright

      - name: Import contracts (kernel 领域无关)
        run: uv run lint-imports

      - name: Tests
        run: uv run pytest

      - name: Eval harness (Tier-1, R2 迭代 gate)
        run: uv run python -m grandquiz.evals

      - name: Web API contract drift
        working-directory: web
        run: npm run api:check

      - name: Web tests
        working-directory: web
        run: npm test

      - name: Web type check
        working-directory: web
        run: npm run typecheck

      - name: Web build
        working-directory: web
        run: npm run build

      - name: Web hosting adapter tests
        working-directory: web
        run: npm run test:sites
