services:
  searxng:
    image: ${SEARXNG_IMAGE:-ghcr.io/searxng/searxng:latest}
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      SEARXNG_SECRET: ${SEARXNG_SECRET:-local-loopback-only-change-me}
    volumes:
      - "./settings.yml:/etc/searxng/settings.yml:ro"
